<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交需求 - 软件工具集</title>
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --green: #10b981;
            --red: #ef4444;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --bg-card: #f8fafc;
            --bg-hover: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--primary); }

        .page-title {
            font-size: 20px;
            font-weight: 700;
        }

        /* Form */
        .form-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px;
            margin: 32px 0;
        }

        .form-section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group:last-child { margin-bottom: 0; }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-label .required {
            color: var(--red);
            margin-left: 2px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .form-textarea {
            min-height: 140px;
            resize: vertical;
        }

        .form-select { cursor: pointer; }

        .submit-section {
            text-align: center;
            padding: 20px 0 60px;
        }

        .btn-submit {
            padding: 12px 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 14px 18px;
            border-radius: 10px;
            margin: 24px 0;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .alert.show { display: flex; }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--green);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--red);
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .container { padding: 0 12px; }
            .form-section { padding: 20px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="/" class="back-link">
                    <i class="fas fa-arrow-left"></i> 返回首页
                </a>
                <div class="page-title"><i class="fas fa-paper-plane"></i> 提交需求</div>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="alert" class="alert">
            <i class="fas fa-info-circle"></i>
            <span id="alert-text"></span>
        </div>

        <div class="form-section">
            <div class="form-section-title">
                <i class="fas fa-lightbulb"></i> 需求表单
            </div>

            <form id="request-form">
                <div class="form-group">
                    <label class="form-label">需求类型 <span class="required">*</span></label>
                    <select class="form-select" id="type" name="type" required>
                        <option value="software">📦 需要某个软件</option>
                        <option value="tool">🔧 需要某个在线工具</option>
                        <option value="feature">✨ 功能建议</option>
                        <option value="bug">🐛 问题反馈</option>
                        <option value="other">💬 其他</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">标题 <span class="required">*</span></label>
                    <input type="text" class="form-input" id="title" name="title" required placeholder="简要描述你的需求...">
                </div>

                <div class="form-group">
                    <label class="form-label">详细描述</label>
                    <textarea class="form-textarea" id="description" name="description" placeholder="详细描述你的需求，比如：&#10;&#10;需要什么软件？&#10;在什么场景下使用？&#10;期望的功能是什么？"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">提交人</label>
                    <input type="text" class="form-input" id="submitter" name="submitter" placeholder="你的名字或昵称（选填）">
                </div>

                <div class="submit-section">
                    <button type="submit" class="btn-submit" id="submit-btn">
                        <i class="fas fa-paper-plane"></i> 提交需求
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Theme
        const saved = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);

        function showAlert(type, msg) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.querySelector('#alert-text').textContent = msg;
        }

        document.getElementById('request-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            if (!title) {
                showAlert('error', '请填写标题');
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> 提交中...';

            try {
                const res = await fetch('/api/request/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: document.getElementById('type').value,
                        title: title,
                        description: document.getElementById('description').value,
                        submitter: document.getElementById('submitter').value,
                    })
                });

                const data = await res.json();

                if (data.code === 0) {
                    showAlert('success', '提交成功，我们会尽快处理你的需求！');
                    e.target.reset();
                    setTimeout(() => window.location.href = '/', 3000);
                } else {
                    showAlert('error', data.message || '提交失败');
                }
            } catch (err) {
                showAlert('error', '网络错误，请重试');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> 提交需求';
            }
        });
    </script>
</body>
</html>
