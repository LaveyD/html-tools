worker_processes 1;
pid /run/html-tools-nginx.pid;
error_log /var/log/nginx/html-tools-error.log;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # ── HTTP → HTTPS 自动跳转 ──
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS 服务器 ──
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL 证书（放在项目目录下，Windows 用相对路径如 D:/html-tools/server.crt）
        ssl_certificate     server.crt;
        ssl_certificate_key server.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS（强制浏览器走 HTTPS，1 年）
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        root /data/project/dct/html-tools;
        index index.html;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
        gzip_min_length 1024;

        location /api/ {
            proxy_pass http://127.0.0.1:8105;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            client_max_body_size 0;
            proxy_connect_timeout 60s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_next_upstream error timeout;
        }

        location = /admin/ {
            return 302 /admin/login.html;
        }

        location = /index.html {
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        location = /tools.json {
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /workers/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(js|css|svg|txt|ico|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot|xml|json)$ {
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location /software/ {
            try_files $uri $uri/ =404;
        }

        location /software_icons/ {
            expires 30d;
            add_header Cache-Control "public";
        }

        location /software_files/ {
            internal;
            client_max_body_size 0;
        }

        location /admin/ {
            try_files $uri $uri/ /admin/login.html;
        }

        location /tools/ {
            try_files $uri $uri/ /tools/$uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
    }
}
