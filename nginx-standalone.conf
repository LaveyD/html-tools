worker_processes 1;
pid /run/html-tools-nginx.pid;
error_log /var/log/nginx/html-tools-error.log;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8104;
        server_name _;

        root /data/project/dct/html-tools;
        index index.html;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
        gzip_min_length 1024;

        location /api/ {
            proxy_pass http://127.0.0.1:8105;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            client_max_body_size 0;
            proxy_connect_timeout 60s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_next_upstream error timeout;
        }

        location = /admin/ {
            return 302 /admin/login.html;
        }

        location = /index.html {
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /workers/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(js|css|svg|txt|ico|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot|xml|json)$ {
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location /software/ {
            try_files $uri $uri/ =404;
        }

        location /admin/ {
            try_files $uri $uri/ /admin/login.html;
        }

        location /tools/ {
            try_files $uri $uri/ /tools/$uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
    }
}
