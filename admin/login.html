<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理登录 - 软件工具集</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --red: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 380px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
        }

        .login-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 20px;
        }

        .login-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .captcha-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .captcha-row .form-input {
            flex: 1;
        }

        .captcha-img {
            width: 120px;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 0.2s;
        }

        .captcha-img:hover {
            opacity: 0.85;
        }

        .captcha-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .captcha-img .placeholder {
            font-size: 12px;
            color: var(--text-muted);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            display: none;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: var(--red);
            font-size: 13px;
            margin-bottom: 16px;
        }

        .error-msg.show { display: block; }

        .back-link {
            display: block;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover { color: var(--primary); }

        .init-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-icon">🔐</div>
        <div class="login-title">管理后台</div>
        <div class="login-subtitle">软件工具集 · 管理面板</div>

        <div class="error-msg" id="error-msg"></div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label">管理密码</label>
                <input type="password" class="form-input" id="password" required placeholder="请输入管理密码" autocomplete="off">
            </div>
            <div class="form-group">
                <label class="form-label">验证码</label>
                <div class="captcha-row">
                    <input type="text" class="form-input" id="captcha-input" required placeholder="输入验证码" autocomplete="off" maxlength="6">
                    <div class="captcha-img" id="captcha-container" title="点击刷新" onclick="loadCaptcha()">
                        <span class="placeholder">加载中...</span>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn-login" id="login-btn">
                <i class="fas fa-sign-in-alt"></i> 登录
            </button>
        </form>

        <a href="/" class="back-link">← 返回首页</a>
    </div>

    <script>
        // ── State ──
        let currentCaptchaToken = '';

        async function initSecurity() {
            loadCaptcha();
        }

        // ── Captcha ──
        async function loadCaptcha() {
            const container = document.getElementById('captcha-container');
            container.innerHTML = '<span class="placeholder">加载中...</span>';
            try {
                const res = await fetch('/api/captcha?' + Date.now());
                if (res.status === 429) {
                    const data = await res.json();
                    container.innerHTML = '<span class="placeholder" style="color:var(--red)">过于频繁</span>';
                    return;
                }
                currentCaptchaToken = res.headers.get('X-Captcha-Token') || '';
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                container.innerHTML = `<img src="${url}" alt="验证码" onload="URL.revokeObjectURL(this.src)">`;
            } catch (err) {
                container.innerHTML = '<span class="placeholder" style="color:var(--red)">加载失败</span>';
            }
        }

        // ── Error display ──
        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.classList.add('show');
        }

        function clearError() {
            document.getElementById('error-msg').classList.remove('show');
        }

        // ── Check existing session ──
        (async () => {
            const token = localStorage.getItem('admin_token');
            if (token) {
                try {
                    const res = await fetch('/api/admin/stats', {
                        headers: { 'X-Admin-Token': token }
                    });
                    if (res.status === 200) {
                        window.location.href = 'index.html';
                    } else {
                        localStorage.removeItem('admin_token');
                    }
                } catch {
                    localStorage.removeItem('admin_token');
                }
            }
        })();

        // ── Login form ──
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            clearError();

            btn.disabled = true;
            btn.innerHTML = '<span style="display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite"></span> 登录中...';

            const styleEl = document.createElement('style');
            styleEl.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
            document.head.appendChild(styleEl);

            try {
                const password = document.getElementById('password').value;
                const captchaAnswer = document.getElementById('captcha-input').value;

                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        password: password,
                        captcha_token: currentCaptchaToken,
                        captcha_answer: captchaAnswer
                    })
                });
                const data = await res.json();

                if (data.code === 0) {
                    localStorage.setItem('admin_token', data.data.token);
                    window.location.href = 'index.html';
                } else {
                    loadCaptcha();
                    document.getElementById('captcha-input').value = '';
                    showError(data.message || '登录失败');
                }
            } catch (err) {
                showError('网络错误，请重试');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 登录';
            }
        });

        // ── Init on load ──
        window.addEventListener('DOMContentLoaded', initSecurity);
    </script>
</body>
</html>
